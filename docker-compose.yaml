version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "github-release-notifier-app"
    depends_on:
      - db
    ports:
      - 8080:8080
    restart: unless-stopped

  db:
    image: "postgres:16-alpine"
    container_name: "github-release-notifier-db"
    restart: unless-stopped
    ports:
      - 5433:5432
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: github_release_notifier

  prometheus:
    image: "prom/prometheus:v3.11.3"
    container_name: "github-release-notifier-prometheus"
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: "grafana/grafana:12.4.3"
    container_name: "github-release-notifier-grafana"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: "grafana/loki:3.6.0"
    container_name: "github-release-notifier-loki"
    restart: unless-stopped
    user: "0:0"
    ports:
      - 3100:3100
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: "grafana/alloy:v1.16.1"
    container_name: "github-release-notifier-alloy"
    depends_on:
      - app
      - loki
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data

volumes:
  data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
