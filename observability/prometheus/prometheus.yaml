global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: github-release-notifier
    static_configs:
      - targets:
          - app:8080
        labels:
          service: github-release-notifier
          environment: dev

  - job_name: github-release-notifier-notification-service
    static_configs:
      - targets:
          - notification-service:8081
        labels:
          service: github-release-notifier-notification-service
          environment: dev

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          environment: dev
