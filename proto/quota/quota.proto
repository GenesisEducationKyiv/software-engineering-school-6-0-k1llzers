syntax = "proto3";

package quota;

option go_package = "github-release-notifier/pkg/contracts/quota;quota";

service QuotaService {
  rpc ReserveSubscriptionSlot(ReserveSubscriptionSlotRequest) returns (ReserveSubscriptionSlotResponse);
  rpc CommitSubscriptionSlot(CommitSubscriptionSlotRequest) returns (CommitSubscriptionSlotResponse);
  rpc ReleaseSubscriptionSlot(ReleaseSubscriptionSlotRequest) returns (ReleaseSubscriptionSlotResponse);
}

message ReserveSubscriptionSlotRequest {
  string saga_id = 1;
  int64 subscription_id = 2;
  string email = 3;
}

message ReserveSubscriptionSlotResponse {
  bool reserved = 1;
  string rejection_reason = 2;
}

message CommitSubscriptionSlotRequest {
  string saga_id = 1;
  int64 subscription_id = 2;
}

message CommitSubscriptionSlotResponse {}

message ReleaseSubscriptionSlotRequest {
  string saga_id = 1;
  int64 subscription_id = 2;
}

message ReleaseSubscriptionSlotResponse {}
