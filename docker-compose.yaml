version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "github-release-notifier-app"
    depends_on:
      - db
    ports:
      - 8080:8080
    restart: unless-stopped

  db:
    image: "postgres:16-alpine"
    container_name: "github-release-notifier-db"
    restart: unless-stopped
    ports:
      - 5433:5432
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: github_release_notifier

volumes:
  data:
